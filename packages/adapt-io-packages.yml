findings:
  - >-
    A consumer integrating the Prospect API v3 must hand-roll an HTTP client. There
    is no first-party SDK, no CLI, and no code sample beyond cURL in any language.
  - >-
    Because there is no published package, there is no release cadence to read — the
    usual SDK-decay signal is simply unavailable for this provider.
