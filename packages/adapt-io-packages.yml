description: >-
  Adapt publishes NO first-party client libraries or SDKs for the Prospect API v3.
  The API documentation ships shell/cURL examples only and names no package in any
  language. Registry searches return nothing owned by Adapt. The only first-party
  distributed client is the Adapt Prospector browser extension, which is an end-user
  product rather than a developer SDK — it is recorded below for completeness and is
  NOT counted as an SDK.
