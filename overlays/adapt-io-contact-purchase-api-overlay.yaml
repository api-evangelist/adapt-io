        Slate reference.
    x-api-access:
      plan: Custom (enterprise) only
      note: Free, Starter and Basic tiers do not issue Prospect API credentials.
      keys: https://leads.adapt.io/profile/settings
- target: $
  description: Document the account-level rate limit and the credit-metering headers that every response
    carries.
  update:
    x-rate-limit:
      limit: 250
      window: 1 minute
      scope: account
      algorithm: fixed-window
      status: 429
      headers:
      - x-ratelimit-limit
      - x-ratelimit-reset
      - x-ratelimit-retry-after
      increase-contact: success@adapt.io
      source: https://www.adapt.io/api-docs/v3/
    x-error-envelope:
      media-type: application/json
      rfc9457: false
      fields:
      - message
      - code
      - data
      note: HTTP 200 is not unconditionally success — branch on `code`. APP-200-002 means no results found.
      catalog: errors/adapt-io-problem-types.yml
- target: $.paths['/contact/fetch'].post
  description: Bind the operation to its credit lane, its documented internal response codes, and its
    agent consequence class.
  update:
    x-credit-type: email credits, phone credits
    x-credit-balance-header: email-remaining-credits, phone-remaining-credits
    x-internal-codes:
    - APP-200-001
    - APP-400-001
    - APP-400-002
    - APP-401-001
    - APP-401-002
    - APP-403-001
    - APP-403-002
    - APP-403-003
    - APP-429-001
    - APP-500-001
    x-consequence: write
    x-idempotent: false
- target: $.paths['/contact/fetch'].post
  description: Flag the only billing-affecting operation in the surface. It spends email and phone credits,
    has no idempotency key, and cannot be undone.
  update:
    x-human-in-the-loop: recommended
    x-batch-limit:
      parameter: contactIds
      max: 50
      error: APP-400-002 — You exceeded the maximum contact Ids to be passed
    x-replay-risk: No idempotency key is documented. A retried call after a timeout may double-spend credits;
      track purchased ids client-side and use dontDisplayOwnedContact on subsequent searches.
