openapi: 3.2.0
info:
  description: Saleslift Enrich APIs for all your data needs!
  version: 1.0.0
  title: Saleslift Contribution API
  termsOfService: /termsAndConditions.htm
  contact:
    name: api@saleslift.io
servers:
- url: http://localhost:8080/api
tags:
- name: contribution
paths:
  /contribution/verificationStatus:
    post:
      tags:
      - contribution
      summary: Stores Data from Instantly
      description: Stores email validation status info from instantly
      operationId: saveInstantlyEmailValidationStatusRequest
      responses:
        '200':
          description: Success
        '500':
          description: Internal Error
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
