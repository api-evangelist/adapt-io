    url: https://docs.google.com/spreadsheets/d/1E6mj35veBUB1jjW3j0caIk94EFEK8hLygh3ZPJMx1_k/edit#gid=1732701238
    machine_readable: false
  - name: adapt-location
    published_as: Google Sheet linked from the API reference
    url: https://docs.google.com/spreadsheets/d/1E6mj35veBUB1jjW3j0caIk94EFEK8hLygh3ZPJMx1_k/edit#gid=901938120
    machine_readable: false
    note: >-
      city/state/country filters must match these values exactly and case-sensitively.
findings:
  - >-
    Four of Adapt's controlled vocabularies — industry, sub-industry, technology and
    location — are distributed as Google Sheets rather than API endpoints or enums in a
    spec. A client cannot validate a filter value without a human opening a spreadsheet,
    and an exact-match requirement makes that a hard failure mode rather than a warning.
  - >-
    Company has no stable identifier. Deduplicating or joining Adapt companies against
    another system requires matching on domain.
